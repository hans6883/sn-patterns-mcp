[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sn-patterns-mcp"
version = "0.3.0"
description = "ServiceNow Discovery pattern intelligence MCP server — Python NDL parser/writer + 28 MCP tools (read, search, validate, author, surgical-edit, emulate)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "hans6883" }]
maintainers = [{ name = "hans6883" }]
keywords = [
    "servicenow",
    "discovery",
    "cmdb",
    "mcp",
    "model-context-protocol",
    "ndl",
    "pattern",
    "snmp",
    "wmi",
    "mib",
    "itom",
    "ai-tools",
    "claude",
    "agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "mcp>=1.2.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/hans6883/sn-patterns-mcp"
Repository = "https://github.com/hans6883/sn-patterns-mcp"
Issues = "https://github.com/hans6883/sn-patterns-mcp/issues"
Changelog = "https://github.com/hans6883/sn-patterns-mcp/blob/master/CHANGELOG.md"
Documentation = "https://github.com/hans6883/sn-patterns-mcp#readme"
"Agent Guide" = "https://github.com/hans6883/sn-patterns-mcp/blob/master/docs/AGENTS.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyflakes>=3.2",
    "ruff>=0.6",
]

[project.scripts]
sn-patterns-mcp = "sn_patterns_mcp.server:main"

[tool.setuptools.packages.find]
include = ["sn_patterns_mcp*"]

[tool.setuptools.package-data]
# What ships in the wheel beyond *.py.
# pattern_index/* and oids/data/* are local artifacts — gitignored, regenerated
# by scripts/export_patterns.py and scripts/build_oid_index.py.
"sn_patterns_mcp" = [
    "data_sources/data/*.json",
    "examples/*.ndl",
]

[tool.setuptools.exclude-package-data]
# Belt-and-braces: even if a developer builds the wheel on a hydrated repo, no
# locally-generated artifact ships. Wildcard globs future-proof against new
# hydration outputs added to scripts/export_patterns.py or build_oid_index.py.
"sn_patterns_mcp" = [
    "pattern_index/*.json",
    "pattern_index/patterns/*.json",
    "pattern_index/*.log",
    "oids/data/*",
    "oids/*.db",
    "oids/*.db-shm",
    "oids/*.db-wal",
    "oids/*.db-journal",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live_index: tests requiring a hydrated local pattern index (skipped if absent)",
]

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = [".venv", "build", "dist", "sn_patterns_mcp/pattern_index"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "RET",  # return hygiene
]
ignore = [
    "E501",  # line length — handled by formatter
    "B008",  # default arg in function call (deliberate for some closures)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # test fixtures may import without using
"sn_patterns_mcp/closures/registry.py" = ["E501"]  # large data table
"scripts/*" = ["E402"]  # imports after sys.path bootstrap are intentional

[tool.coverage.run]
source = ["sn_patterns_mcp"]
omit = [
    "sn_patterns_mcp/pattern_index/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
